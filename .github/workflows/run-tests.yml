name: run-tests

on:
  push:
    branches: [master, 1.0]
  pull_request:
    branches: [master, 1.0]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - php: 8.4
            laravel: 12.*
            phpunit: ^11.0
            ramsey: ^4.7
          - php: 8.4
            laravel: 11.*
            phpunit: ^10.1
            ramsey: ^4.7
          - php: 8.3
            laravel: 12.*
            phpunit: ^11.0
            ramsey: ^4.7
          - php: 8.3
            laravel: 11.*
            phpunit: ^10.1
            ramsey: ^4.7
          - php: 8.3
            laravel: 10.*
            phpunit: ^10.1
            ramsey: ^4.7
          - php: 8.2
            laravel: 11.*
            phpunit: ^10.1
            ramsey: ^4.7
          - php: 8.2
            laravel: 10.*
            phpunit: ^10.1
            ramsey: ^4.7
          - php: 8.3
            laravel: 9.*
            phpunit: ^9.0
            ramsey: ^4.7
          - php: 8.2
            laravel: 9.*
            phpunit: ^9.0
            ramsey: ^4.7
          - php: 8.1
            laravel: 9.*
            phpunit: ^9.0
            ramsey: ^4.7

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Install dependencies
        run: |
          composer require "illuminate/support:${{ matrix.laravel }}" "ramsey/uuid:${{ matrix.ramsey }}" --no-interaction --no-update
          composer require "phpunit/phpunit:${{ matrix.phpunit }}" --no-interaction --no-update --dev
          composer update --prefer-stable --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      - name: Execute tests
        run: vendor/bin/phpunit
